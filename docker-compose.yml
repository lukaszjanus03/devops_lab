version: '3.8'

services:
  # Serwis backendu (Twoja aplikacja Python)
  backend:
    build: ./backend  # Wskazuje na katalog /backend
    container_name: backend_app
    networks:
      - app_network
    # Nie musimy tu mapować portu (expose), 
    # ponieważ Nginx będzie się z nim komunikował wewnętrznie.

  # Serwis frontendu (Nginx jako reverse proxy)
  nginx:
    build: ./nginx  # Wskazuje na katalog /nginx
    container_name: nginx_proxy
    ports:
      - "80:80"     # Udostępniamy port 80 na zewnątrz (hosta)
    depends_on:
      - backend     # Nginx uruchomi się dopiero po starcie backendu
    networks:
      - app_network

# Definicja wirtualnej sieci
networks:
  app_network:
    driver: bridge
