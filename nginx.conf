upstream backend_server {
  # 'backend' to nazwa serwisu z docker-compose.yml
  # Łączy się z serwisem 'backend' na jego wewnętrznym porcie 8080
  server backend:8080;
}

server {
  # Kontener Nginx wewnętrznie słucha na porcie 80
  listen 80;

  location / {
    # Przekierowuje cały ruch do naszego serwera 'backend'
    proxy_pass http://backend_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
